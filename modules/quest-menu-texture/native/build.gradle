apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.questmenutexture'
version = '1.0.0'

android {
  namespace 'expo.modules.questmenutexture'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
    consumerProguardFiles 'consumer-rules.pro'
  }
}

dependencies {
  // Arguments, ReactContext, and Readable* for the Viro material bridge.
  implementation 'com.facebook.react:react-android'
}
